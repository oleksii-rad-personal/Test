<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Трекер бюджету</title>
  <meta name="theme-color" content="#4F86B5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Трекер">
  <!-- iPhone: маніфест без start_url, щоб іконка памʼятала адресу з ключем (дані iOS-застосунку окремі від Safari) -->
  <script>document.write('<link rel="manifest" id="manifest" href="' + (/iphone|ipad|ipod/i.test(navigator.userAgent) ? 'manifest.ios.webmanifest' : 'manifest.webmanifest') + '">');</script>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <main id="main"></main>
    <nav id="nav" hidden>
      <button data-view="home"><span>🏠</span>Головна</button>
      <button data-view="ops"><span>🧾</span>Операції</button>
      <button data-view="add" class="plus" aria-label="Додати операцію">＋</button>
      <button data-view="settings"><span>⚙️</span>Налаштування</button>
    </nav>
  </div>
  <div id="toast" hidden></div>
  <div id="overlay" hidden></div>
  <script src="app.js"></script>
</body>
</html>
